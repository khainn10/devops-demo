# compose.yaml - chay dong thoi 2 dich vu: web (giao dien) va api (xu ly)
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: "1.0"
    image: devops-demo:compose
    # Khong mo cong ra may host: chi dich vu web trong cung mang moi goi duoc api

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
